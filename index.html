<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <header>
        <h1>Paleta de Cores</h1>
    </header>
    <main>
        <section id="input-box">
            <Button id="clear-board">Limpar Quadro</Button>
            <div id="div-input">
                <input type="number" placeholder="Largura" id="input-width">
                <input type="number" placeholder="Comprimento" id="input-height">
                <button id="input-button">Atribuir</button>
            </div>
        </section>
        <section>
            <div id="color-palette"></div>
            <button id="palette-reset">Resetar Paleta</button>
        </section>
        <section>
            <div id="pixel-board"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
