name: CI/CD - Lint e Deploy no GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1 - CI: Validação de Lint (Roda no PR e na Main)
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar ESLint
        run: npm run lint

  # JOB 2 - Build: Empacota os arquivos estáticos
  # Só roda no Push da Main e se o Job de Lint passar
  build:
    name: Build (preparar artefato estático)
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Cria um arquivo .nojekyll para garantir que o Pages não ignore arquivos JS/CSS
      - name: Desativar Jekyll no GitHub Pages
        run: touch .nojekyll

      - name: Empacotar artefato para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  # JOB 3 - Deploy: Publica no GitHub Pages
  deploy:
    name: Deploy no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4